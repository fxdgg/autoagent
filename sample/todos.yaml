# =============================================================================
# cuFFTDx DCT3D Kernel Optimization - AutoAgent Test Task
# =============================================================================
# This configuration drives the AI to iteratively optimize a 3D DCT kernel
# built on cuFFTDx. The AI must:
#   1. Build the project & record baseline performance
#   2. Use NVIDIA Nsight Compute (ncu) to profile kernel bottlenecks
#   3. Modify CUDA code to improve performance
#   4. Rebuild, benchmark, and verify correctness (Score: 100/100)
#   5. Git commit if improved ≥ 20%, git reset if not
#   6. Iterate until the cumulative speedup target is met
# =============================================================================

tasks:
  # ==========================================================================
  # Task 1: Optimize cuFFTDx DCT3D Kernel (nested task with iterative loop)
  # ==========================================================================
  - id: 1
    name: "Optimize cuFFTDx DCT3D Kernel Performance"
    type: nested
    max_attempts: 100
    completion_criteria: |
      The overall performance of the cuFFTDx DCT3D kernel (64x64x64, forward + inverse)
      must improve by at least 20% compared to the initial baseline.
      Specifically:
        - The program must still produce correct results (Score: 100/100 in output)
        - The total execution time (measured via CUDA events around DCT3D forward+inverse
          in the 100-iteration loop) must be at least 20% lower than baseline
        - A git commit must exist recording the successful optimization
      
      The baseline timing is recorded in baseline_timing.txt at the start.
      The current timing should be compared against it after each optimization round.

    subtasks:
      # -----------------------------------------------------------------------
      # Step 1: Build the project and record baseline performance
      # -----------------------------------------------------------------------
      - id: 1.1
        name: "Build project and record baseline performance"
        type: simple
        completion_criteria: |
          1. The project builds successfully using CMake:
             - Configure: cmake -B build -DCMAKE_BUILD_TYPE=Release
             - Build: cmake --build build --config Release
          2. The built executable runs correctly: build/Release/main.exe
             Output must show "Score: 100/100"
          3. A baseline timing measurement is recorded:
             - Modify main.cpp to add CUDA event timing around the 100-iteration
               benchmark loop (cudaEventCreate, cudaEventRecord before/after the loop,
               cudaEventSynchronize, cudaEventElapsedTime)
             - Print the elapsed time in milliseconds with format: "Elapsed: XXX.XX ms"
             - Rebuild and run, then save the output to baseline_timing.txt
             - The baseline_timing.txt file must exist and contain the timing value
          
          IMPORTANT: Do NOT modify the correctness test (Score calculation) logic.
          Only ADD timing instrumentation around the existing benchmark loop.
        initial_hint: |
          The project uses CMake with a custom CUDA compilation setup.
          Key files:
            - CMakeLists.txt: Main build config
            - build_cufftdx.cmake: cuFFTDx compilation rules (nvcc with sm_75)
            - main.cpp: Benchmark program (100 iterations of DCT3D forward+inverse)
            - cufftdx_dct3d.cuh: Kernel header (DCT/IDCT kernel implementations)
            - cufftdx_dct3d_dispatch.cu: Dispatch and launch functions
          
          Build commands:
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
          
          Run: build/Release/main.exe
          
          For timing, add CUDA events in main.cpp around the for-loop:
            cudaEvent_t start, stop;
            cudaEventCreate(&start);
            cudaEventCreate(&stop);
            cudaEventRecord(start, defaultStream.stream);
            // ... existing benchmark loop ...
            cudaEventRecord(stop, defaultStream.stream);
            cudaEventSynchronize(stop);
            float ms = 0;
            cudaEventElapsedTime(&ms, start, stop);
            safmt::println("Elapsed: {:.2f} ms", ms);
          
          Save the output: build/Release/main.exe > baseline_timing.txt 2>&1

      # -----------------------------------------------------------------------
      # Step 2: Profile kernels with NVIDIA Nsight Compute (ncu)
      # -----------------------------------------------------------------------
      - id: 1.2
        name: "Profile kernels with ncu and identify bottlenecks"
        type: long_running
        completion_criteria: |
          1. The ncu profiling command has finished successfully and ncu_output.txt exists
          2. The AI should analyze the ncu output and identify:
             - Which kernels take the most time (fused_dct_axis_kernel / fused_idct_axis_kernel)
             - Memory bandwidth utilization (DRAM throughput, L1/L2 cache hit rates)
             - Compute utilization (SM occupancy, warp execution efficiency)
             - Any stall reasons (memory dependency, instruction fetch, etc.)
          3. Write a brief analysis to ncu_analysis.txt containing:
             - Key bottleneck identification
             - Specific metrics that suggest optimization opportunities
             - Proposed optimization strategies based on the profile data
          4. The file ncu_analysis.txt must exist and contain meaningful analysis
        initial_hint: |
          Use autoagent-exec to run the ncu profiling command. For example:
            ncu --kernel-name regex:"fused_(i?dct)_axis_kernel" --launch-skip 0 --launch-count 3 --page details build/Release/main.exe
          
          The profiling may take several minutes. After it completes, you will
          be called back to analyze the results and write ncu_analysis.txt.

      # -----------------------------------------------------------------------
      # Step 3: Optimize the CUDA kernel code
      # -----------------------------------------------------------------------
      - id: 1.3
        name: "Optimize CUDA kernel based on profiling results"
        type: simple
        completion_criteria: |
          1. Read the analysis from ncu_analysis.txt
          2. Modify the CUDA code (cufftdx_dct3d.cuh and/or cufftdx_dct3d_dispatch.cu)
             to improve performance based on the identified bottlenecks
          3. Possible optimization strategies include (but are not limited to):
             - Precompute twiddle factors in shared memory instead of per-thread cosf/sinf
             - Improve memory access coalescing for non-X axis operations
             - Use __sincosf() intrinsic instead of separate cosf()/sinf() calls
             - Batch multiple slices per thread block to improve occupancy
             - Use vectorized loads/stores (float2, float4) where possible
             - Reduce register pressure by reusing variables
             - Optimize the pre/post processing steps to overlap with FFT computation
             - Align shared memory accesses to avoid bank conflicts
          4. The modified code must compile without errors
          
          IMPORTANT: Keep the correctness-critical algorithm intact. Only optimize
          the implementation, not the mathematical approach.
        initial_hint: |
          The core kernels are in cufftdx_dct3d.cuh:
            - fused_dct_axis_kernel: DCT-II via FFT with pre/post processing
            - fused_idct_axis_kernel: IDCT-II via IFFT with pre/post processing
          
          Both kernels follow the pattern:
            1. PreProcess: load + reorder input data
            2. FFT/IFFT: execute via cuFFTDx
            3. PostProcess: apply twiddle factors + write output
          
          Low-hanging fruit optimizations:
            - Replace cosf()/sinf() with __sincosf() or sincosf() intrinsic
            - Precompute twiddle factors into shared memory (they only depend on index)
            - For AXIS=1 and AXIS=2, memory access is strided → consider using 
              shared memory as a transpose buffer for coalesced global access
            - The norm constants (norm, norm0) can be precomputed once per block

      # -----------------------------------------------------------------------
      # Step 4: Build, benchmark, and verify correctness
      # -----------------------------------------------------------------------
      - id: 1.4
        name: "Build optimized code and benchmark"
        type: simple
        completion_criteria: |
          1. Rebuild the project:
             cmake --build build --config Release
          2. Run the benchmark: build/Release/main.exe
          3. Output must show:
             - "Score: 100/100" (correctness preserved)
             - "Elapsed: XXX.XX ms" (timing measurement)
          4. Read baseline_timing.txt to get the baseline timing
          5. Calculate the speedup percentage:
             speedup = (baseline - current) / baseline * 100%
          6. Write results to optimization_result.txt:
             - Baseline time (ms)
             - Current time (ms)
             - Speedup percentage
             - Whether the 20% target is met
          7. If correctness fails (Score < 100/100), report this clearly as a failure
        initial_hint: |
          Build: cmake --build build --config Release
          Run: build/Release/main.exe
          
          Parse the output for "Elapsed: XXX.XX ms" to get current timing.
          Parse baseline_timing.txt for the baseline value.
          Calculate: speedup = (baseline_ms - current_ms) / baseline_ms * 100
          
          Write to optimization_result.txt, for example:
            Baseline: 123.45 ms
            Current:  98.76 ms
            Speedup:  20.0%
            Target met: YES/NO

      # -----------------------------------------------------------------------
      # Step 5: Git commit or reset based on results
      # -----------------------------------------------------------------------
      - id: 1.5
        name: "Git commit if improved, git reset if not"
        type: simple
        completion_criteria: |
          1. Read optimization_result.txt to check the result
          2. If the optimization was effective (current time < baseline time AND
             correctness Score: 100/100):
             - Run: git add -A
             - Run: git commit -m "perf: optimize cuFFTDx DCT3D kernel - X.X% speedup"
               (where X.X% is the actual speedup achieved)
             - Update baseline_timing.txt with the new (better) timing as the new baseline
             - Report: "✅ completed - Optimization committed with X.X% speedup"
          3. If the optimization was NOT effective (no speedup or correctness broken):
             - Run: git checkout -- cufftdx_dct3d.cuh cufftdx_dct3d_dispatch.cu main.cpp
               (reset only the source files, keep baseline_timing.txt and analysis files)
             - Report: "✅ completed - Reverted ineffective changes"
          4. In either case, this subtask should report completed so the orchestrator
             can proceed to evaluate whether the overall 20% target is met.
        initial_hint: |
          Read optimization_result.txt to determine the outcome.
          
          If speedup > 0 and correctness OK:
            git add -A
            git commit -m "perf: optimize cuFFTDx DCT3D kernel - X.X% speedup"
            # Update baseline for next iteration:
            copy the current timing into baseline_timing.txt
          
          If no improvement or broken:
            git checkout -- cufftdx_dct3d.cuh cufftdx_dct3d_dispatch.cu main.cpp
          
          Always mark this step as completed regardless of commit/reset outcome,
          so that the main task evaluation can decide whether to continue iterating.
