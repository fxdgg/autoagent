# =============================================================================
# Test 5: once-type subtask behavior in nested tasks
# =============================================================================
# This configuration tests that simple_once and long_running_once subtasks
# are NOT re-executed when:
#   - A failure analysis triggers retry_from to an earlier subtask
#   - A main task evaluation triggers retry_from to an earlier subtask
#
# Expected behavior:
#   - Subtask 1.1 (simple_once) executes once, then is skipped on all retries
#   - Subtask 1.2 (long_running_once) executes once, then is skipped on all retries
#   - Subtask 1.3 (simple) is re-executed on retries as normal
#   - Subtask 1.4 (simple) is re-executed on retries as normal
# =============================================================================

tasks:
  - id: 1
    name: "Test once-type subtask behavior"
    type: nested
    max_attempts: 100
    completion_criteria: |
      All subtasks completed successfully.
      The setup (1.1) and data preprocessing (1.2) should only run once.
      The main processing (1.3) and validation (1.4) should produce correct results.

    subtasks:
      # Step 1: One-time environment setup (should NOT be re-executed on retry)
      - id: 1.1
        name: "One-time environment setup"
        type: simple_once
        completion_criteria: |
          Environment is set up correctly.
        initial_hint: |
          Install dependencies and configure the environment.

      # Step 2: One-time data preprocessing (long_running_once, should NOT be re-executed)
      - id: 1.2
        name: "One-time data preprocessing"
        type: long_running_once
        completion_criteria: |
          Data preprocessing completed, output files generated.
        initial_hint: |
          Run the data preprocessing pipeline.

      # Step 3: Main processing (normal simple task, will fail first time)
      - id: 1.3
        name: "Main processing"
        type: simple
        max_attempts: 1
        completion_criteria: |
          Processing completed with correct output.
        initial_hint: |
          Run the main processing pipeline.

      # Step 4: Validation (normal simple task)
      - id: 1.4
        name: "Validate results"
        type: simple
        completion_criteria: |
          All validation checks pass.
        initial_hint: |
          Run validation checks on the output.
