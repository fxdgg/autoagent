# =============================================================================
# AI Scheduler Test - Ideas Mode (max_rounds=4)
# =============================================================================

description: |
  AI scheduler test project for ideas integration testing.

ai_orchestrator:
  strategy: |
    Execute tasks as they become available. New tasks may be added via ideas.
  max_rounds: 4
  stop_condition: |
    All available tasks completed or stop requested.
  last_result:
    1:
      type: response
    2:
      type: response

tasks:
  - id: 1
    name: "Initial setup"
    description: "Set up the initial project environment."
    type: simple
    completion_criteria: |
      Environment is set up.

  - id: 2
    name: "Run baseline"
    description: "Run the baseline benchmark."
    type: simple
    completion_criteria: |
      Baseline benchmark completed.
