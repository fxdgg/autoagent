# =============================================================================
# Test 8: max_attempts exhausted causing task failure
# =============================================================================
# This configuration tests that when a nested task exhausts its max_attempts,
# the orchestrator correctly marks the task as failed and moves on.
#
# Task structure:
#   Task 1: nested (max_attempts=2)
#     - 1.1: simple (succeeds)
#     - 1.2: simple (max_attempts=1, always fails)
#   Task 2: simple (should still execute after task 1 fails)
#
# Expected behavior:
#   - Task 1 round 1: subtask 1.1 succeeds, 1.2 fails
#   - Failure analysis decides retry_from=1.2
#   - Task 1 round 2: subtask 1.2 fails again
#   - Failure analysis runs again
#   - max_attempts=2 exhausted, task 1 marked as failed
#   - Task 2 still executes and succeeds
# =============================================================================

description: |
  Test project for max_attempts exhaustion behavior.

ai_orchestrator:
  strategy: |
    Execute tasks sequentially.
  max_rounds: 5
  stop_condition: |
    All tasks completed.
  last_result:
    1:
      type: response
    2:
      type: response

tasks:
  - id: 1
    name: "Task that will exhaust max_attempts"
    description: "A nested task that will exhaust its max_attempts due to a failing subtask."
    type: nested
    max_attempts: 2
    completion_criteria: |
      All subtasks completed successfully.
    subtasks:
      - id: 1.1
        name: "Setup step"
        type: simple
        completion_criteria: |
          Setup completed.

      - id: 1.2
        name: "Failing step"
        type: simple
        max_attempts: 1
        completion_criteria: |
          Processing completed correctly.

  - id: 2
    name: "Task after failed task"
    description: "A simple task that should execute even after the previous task failed."
    type: simple
    completion_criteria: |
      This task completed successfully.
    initial_hint: |
      This is a simple task that should execute even after task 1 failed.
