# ==========================================================================
# AutoAgent Task Configuration Examples (todos.yaml)
# ==========================================================================
# This file demonstrates all 6 task types with realistic, well-structured
# examples. Copy and adapt these patterns for your own todos.yaml.
#
# For the full design guide, see TASK_DESIGN_GUIDE.md.
# ==========================================================================

# Optional project-level description.
# This is injected into every task's prompt so the AI always knows
# the big picture, even when individual tasks are very fine-grained.
description: |
  Optimize a CUDA image-processing pipeline for maximum throughput.
  The project uses CMake + CUDA 12, targets an RTX 4090, and must
  maintain Score 100/100 on the correctness test at all times.

tasks:
  # ========================================================================
  # Example 1: Top-level simple task — straightforward single-step work
  # ========================================================================

  - id: 1
    name: "Build project and establish baseline timing"
    type: simple
    completion_criteria: |
      1. cmake -B build -DCMAKE_BUILD_TYPE=Release completes without errors.
      2. cmake --build build --config Release completes without errors.
      3. build/Release/main.exe runs and outputs "Score: 100/100".
      4. Elapsed time is printed in format "Elapsed: XXX.XX ms".
      5. The timing value is saved to baseline_timing.txt.
    initial_hint: |
      The project uses CMake with CUDA support.
      Build commands:
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
      Run: build/Release/main.exe
      IMPORTANT: Do NOT modify the correctness test (Score calculation).

  # ========================================================================
  # Example 2: Top-level simple task with model: lite
  # Use model: lite for tasks that only run commands or do trivial edits.
  # ========================================================================

  - id: 2
    name: "Run linter and format code"
    type: simple
    model: lite
    completion_criteria: |
      1. black src/ --check returns exit code 0 (all files formatted).
      2. ruff check src/ returns exit code 0 (no lint errors).
    initial_hint: |
      Run: black src/ && ruff check src/
      If formatting issues exist, run black src/ to auto-fix first.

  # ========================================================================
  # Example 3: Nested task — multi-step workflow with AI evaluation
  # ========================================================================

  - id: 3
    name: "Optimize database query performance"
    type: nested
    max_attempts: 10
    completion_criteria: |
      1. Average query response time < 100ms (measured by benchmark in step 3).
      2. All existing tests pass: pytest tests/ returns exit code 0.
      3. No N+1 query patterns remain (verified by django-debug-toolbar output).
    subtasks:
      - id: 3.1
        name: "Profile and identify slow queries"
        type: simple
        completion_criteria: |
          1. Slow query analysis saved to docs/query_analysis.md.
          2. At least 3 slowest queries identified with their execution plans.
          3. Each query includes current avg response time (from EXPLAIN ANALYZE).
        initial_hint: |
          Use Django's connection.queries or django-debug-toolbar.
          Focus on endpoints: /api/users/, /api/orders/, /api/products/.
          Run: python manage.py shell -c "from profiling import run; run()"

      - id: 3.2
        name: "Add indexes and optimize queries"
        type: simple
        completion_criteria: |
          1. Django migration file created in orders/migrations/.
          2. python manage.py migrate runs without errors.
          3. Optimized queries use SELECT with specific columns (no SELECT *).

      - id: 3.3
        name: "Run benchmark and verify improvement"
        type: simple
        completion_criteria: |
          1. python benchmark.py completes and prints results.
          2. Average response time < 100ms (printed as "Avg: XXX ms").
          3. pytest tests/ returns exit code 0.

  # ========================================================================
  # Example 4: Nested task with long_running and simple_once subtasks
  # ========================================================================

  - id: 4
    name: "Train and evaluate image classification model"
    type: nested
    max_attempts: 8
    completion_criteria: |
      1. Model checkpoint exists at checkpoints/best_model.pth.
      2. Validation accuracy >= 0.92 (from evaluation report).
      3. Evaluation report saved to results/eval_report.json.
    subtasks:
      # simple_once: data preparation only needs to happen once.
      # Even if training fails and we retry from 4.2, data stays ready.
      - id: 4.1
        name: "Download and prepare training data"
        type: simple_once
        completion_criteria: |
          1. python scripts/download_data.py exits with code 0.
          2. data/train/ contains at least 10,000 images.
          3. data/val/ contains at least 2,000 images.
          4. data/class_mapping.json exists and lists all class names.
        initial_hint: |
          Run: python scripts/download_data.py --output-dir data/
          This downloads ~2GB of data. Verify with: ls data/train/ | wc -l

      - id: 4.2
        name: "Configure training hyperparameters"
        type: simple
        completion_criteria: |
          1. configs/train_config.yaml updated with learning_rate, batch_size,
             and num_epochs values.
          2. python -c "import yaml; yaml.safe_load(open('configs/train_config.yaml'))"
             exits without errors (valid YAML).

      # long_running: training takes 30+ minutes
      - id: 4.3
        name: "Train the model"
        type: long_running
        completion_criteria: |
          1. Training script exits with code 0.
          2. checkpoints/best_model.pth exists and is > 1MB.
          3. Training log shows final validation accuracy (look for "val_acc:").
        initial_hint: |
          Command: python train.py --config configs/train_config.yaml
          Training typically takes 30-60 minutes on GPU.

      - id: 4.4
        name: "Evaluate model and generate report"
        type: simple
        completion_criteria: |
          1. python evaluate.py --model checkpoints/best_model.pth exits with code 0.
          2. results/eval_report.json exists and contains "accuracy" field >= 0.92.
          3. results/confusion_matrix.png exists.

  # ========================================================================
  # Example 5: Looping task — iterative optimization cycle
  # ========================================================================

  - id: 5
    name: "Iterative CUDA kernel optimization"
    type: looping
    repeat_count: 3
    max_attempts_per_loop: 8
    completion_criteria: |
      3 rounds of profile-optimize-benchmark completed.
    subtasks:
      # long_running_once: baseline profiling only needs to happen once.
      # Subsequent iterations skip this and go straight to optimization.
      - id: 5.1
        name: "Profile kernel with Nsight Compute"
        type: long_running_once
        system_prompt_prefix: |
          You are a GPU performance engineer. Focus on memory throughput,
          occupancy, and warp efficiency metrics when analyzing profiles.
        completion_criteria: |
          1. ncu profiling exits with code 0.
          2. Profile output saved to profile/baseline.ncu-rep.
          3. File size > 100KB (valid profile data).
        initial_hint: |
          Command: ncu --set full -o profile/baseline build/Release/main.exe
          This typically takes 5-15 minutes.

      - id: 5.2
        name: "Analyze profile and optimize kernel code"
        type: simple
        # Per-task system_prompt_prefix: customizes the AI persona for this
        # specific subtask. Different subtasks can have different personas.
        system_prompt_prefix: |
          You are a senior C++/CUDA engineer. Follow these rules:
          - Prefer modern C++17 features.
          - Always check CUDA error codes with a macro.
          - Write concise comments for non-obvious logic.
        completion_criteria: |
          1. At least one optimization applied to src/kernel.cu.
          2. cmake --build build --config Release completes without errors.
          3. build/Release/main.exe outputs "Score: 100/100" (correctness preserved).
        initial_hint: |
          Read the ncu profile at profile/baseline.ncu-rep using ncu CLI:
            ncu --import profile/baseline.ncu-rep --csv
          Key metrics to look for: memory throughput, occupancy, warp efficiency.
          Kernel source: src/kernel.cu

      - id: 5.3
        name: "Benchmark and commit or rollback"
        type: simple
        completion_criteria: |
          1. build/Release/main.exe runs and prints "Elapsed: XXX.XX ms".
          2. If elapsed time improved vs previous iteration:
             - git commit with message describing the optimization.
          3. If elapsed time regressed:
             - git checkout -- src/kernel.cu to rollback changes.
          4. Current timing saved to timing_history.txt (appended).

  # ========================================================================
  # Example 6: Nested task with long_running_once for expensive one-time setup
  # ========================================================================

  - id: 6
    name: "Deploy and validate microservice"
    type: nested
    max_attempts: 5
    completion_criteria: |
      1. Service responds to GET /health with 200 OK.
      2. All integration tests pass: pytest tests/integration/ returns exit code 0.
      3. Response time for GET /api/v1/status < 500ms.
    subtasks:
      - id: 6.1
        name: "Build Docker image"
        type: long_running_once
        completion_criteria: |
          1. docker build exits with code 0.
          2. docker images shows "myservice:latest" with size > 50MB.
        initial_hint: |
          Command: docker build -t myservice:latest .

      - id: 6.2
        name: "Start service and run integration tests"
        type: simple
        completion_criteria: |
          1. docker compose up -d exits without errors.
          2. curl http://localhost:8080/health returns 200 within 30 seconds.
          3. pytest tests/integration/ returns exit code 0.
        initial_hint: |
          Run: docker compose up -d
          Wait for health check: curl --retry 10 --retry-delay 3 http://localhost:8080/health
          Then: pytest tests/integration/ -v

# ==========================================================================
# Quick Reference
# ==========================================================================
#
# Task types (6 total):
#   simple           — AI completes autonomously. Top-level or subtask.
#   nested           — Multi-step with AI evaluation. Top-level only.
#   looping          — Fixed N iterations. Top-level only.
#   long_running     — Background process via autoagent-exec. Subtask only.
#   simple_once      — Like simple, but never re-executed once completed. Subtask only.
#   long_running_once — Like long_running, but never re-executed once completed. Subtask only.
#
# Common fields:  id, name, type, completion_criteria, model (optional),
#                 system_prompt_prefix (optional)
# simple:         + initial_hint (optional)
# nested:         + subtasks, max_attempts (optional, default 5)
# looping:        + subtasks, repeat_count, max_attempts_per_loop (optional, default 5)
# long_running:   + command (optional), initial_hint (optional)
# *_once:         Same fields as their base type
#
# Key principles:
#   - completion_criteria must be specific and measurable (file exists, exit code, output pattern)
#   - Use simple_once / long_running_once for one-time setup that shouldn't repeat on retry
#   - Use model: lite for trivial tasks (run a command, simple file edit)
#   - Don't over-decompose: if one step suffices, use a single simple task
#
# Per-task AI persona (system_prompt_prefix):
#   Set system_prompt_prefix on any task to customize the AI's role/persona.
#   Example:
#     - id: 1
#       name: "Optimize kernel"
#       type: simple
#       system_prompt_prefix: "You are a senior CUDA engineer."
#   Each task can have its own prefix — different tasks can have different personas.
#   See TASK_DESIGN_GUIDE.md §12 for details.
# ==========================================================================
