# 任务配置示例
# 这是一个示例配置文件，你可以复制它作为 todos.yaml 的模板

tasks:
  # ==========================================
  # 简单任务 (simple)
  # AI 自主完成的任务，涵盖命令执行、代码修改、分析等所有场景
  # 可作为顶层任务或嵌套任务的子任务
  # ==========================================
  
  - id: 1
    name: "下载数据集"
    type: simple
    completion_criteria: "data.csv 文件存在且大小 > 10MB"
    initial_hint: "使用 python download.py"
    
  - id: 2
    name: "运行代码检查"
    type: simple
    model: simple
    completion_criteria: "pylint 评分 >= 9.0 且无严重错误"
    initial_hint: "运行 pylint src/"
    
  - id: 3
    name: "分析性能瓶颈"
    type: simple
    completion_criteria: "生成性能分析报告并保存到 profile_report.txt"
    initial_hint: "运行 python profile.py"
    
  # ==========================================
  # 嵌套任务 (nested)
  # 包含多个子任务的复杂任务
  # 子任务类型可以是 simple 或 long_running
  # ==========================================
  
  - id: 10
    name: "优化模型精度"
    type: nested
    completion_criteria: |
      训练成功完成
      验证集精度 >= 0.9
      验证集 loss < 0.1
    subtasks:
      # 简单任务（代码修改场景）
      - id: 10.1
        name: "修改模型配置"
        type: simple
        completion_criteria: "模型配置修改完成，包括学习率、网络结构等参数"
        
      # 长时间任务：运行训练
      - id: 10.2
        name: "训练模型"
        type: long_running
        command: "python train.py --config config.yaml"
        completion_criteria: "训练正常退出且验证集指标满足要求（accuracy >= 0.9）"
        
  - id: 11
    name: "优化代码性能"
    type: nested
    completion_criteria: |
      运行时间 < 5 秒
      功能测试全部通过
    subtasks:
      # 简单任务（代码优化场景）
      - id: 11.1
        name: "优化热点代码"
        type: simple
        completion_criteria: "热点代码优化完成，包括算法优化和数据结构优化"
        
      # 简单任务（运行测试场景）
      - id: 11.2
        name: "运行基准测试"
        type: simple
        completion_criteria: "基准测试完成且性能达标（运行时间 < 5s）"
        initial_hint: "运行 python benchmark.py"
        
      # 简单任务（功能验证场景）
      - id: 11.3
        name: "功能验证"
        type: simple
        completion_criteria: "所有功能测试通过"
        initial_hint: "运行 python test.py"
        
  - id: 12
    name: "修复代码质量问题"
    type: nested
    completion_criteria: |
      pylint 评分 >= 9.0
      符合 PEP8 规范
      无严重警告
    subtasks:
      # 简单任务（分析场景）
      - id: 12.1
        name: "分析代码警告"
        type: simple
        completion_criteria: "分析所有 pylint 警告，生成问题列表和修复方案"
        
      # 简单任务（代码修复场景）
      - id: 12.2
        name: "修复代码问题"
        type: simple
        completion_criteria: "所有警告和问题已修复"
        
  # ==========================================
  # 循环任务 (looping)
  # 固定循环 N 次执行所有子任务
  # 适合迭代优化场景（profile → optimize → benchmark → commit）
  # ==========================================
  
  - id: 15
    name: "迭代优化 CUDA 内核性能"
    type: looping
    repeat_count: 5
    max_attempts_per_loop: 10
    completion_criteria: |
      完成 5 轮优化迭代
      每轮包含：性能分析、代码优化、基准测试、提交
    subtasks:
      # 步骤1：性能分析（长时间任务）
      - id: 15.1
        name: "使用 ncu 分析性能瓶颈"
        type: long_running
        completion_criteria: "ncu 分析完成，生成性能报告"
        initial_hint: "运行 ncu 对内核进行性能分析"
        
      # 步骤2：优化代码
      - id: 15.2
        name: "根据分析结果优化代码"
        type: simple
        completion_criteria: "代码优化完成，编译通过"
        
      # 步骤3：基准测试
      - id: 15.3
        name: "运行基准测试验证优化效果"
        type: simple
        completion_criteria: "基准测试完成，记录性能数据"
        initial_hint: "编译并运行基准测试程序"
        
      # 步骤4：提交或回退
      - id: 15.4
        name: "提交优化结果或回退"
        type: simple
        completion_criteria: "如果性能提升则 git commit，否则 git reset"

  # ==========================================
  # 更复杂的嵌套任务示例
  # ==========================================
  
  - id: 20
    name: "端到端机器学习流程"
    type: nested
    completion_criteria: |
      数据准备完成
      模型训练成功
      模型评估通过
      验证集精度 >= 0.95
    subtasks:
      # 步骤1：数据准备
      - id: 20.1
        name: "准备训练数据"
        type: simple
        completion_criteria: "训练数据和验证数据准备完成，文件格式正确"
        initial_hint: "运行 python prepare_data.py"
        
      # 步骤2：数据增强（AI 修改代码）
      - id: 20.2
        name: "实现数据增强"
        type: simple
        completion_criteria: "数据增强功能实现完成，包括随机裁剪、旋转等"
        
      # 步骤3：训练（长时间任务）
      - id: 20.3
        name: "训练模型"
        type: long_running
        command: "python train.py --data augmented_data --model model.yaml"
        completion_criteria: "训练正常完成，模型文件保存成功"
        
      # 步骤4：评估
      - id: 20.4
        name: "评估模型"
        type: simple
        completion_criteria: "模型评估完成，生成评估报告"
        initial_hint: "运行 python evaluate.py --model model.pth"

# ==========================================
# 配置说明
# ==========================================
#
# 任务类型说明（共 4 种）：
#
# 1. simple（简单任务）
#    - AI 自主完成的任务
#    - 涵盖命令执行、代码修改、分析等所有场景
#    - 可作为顶层任务或嵌套/循环任务的子任务
#    - 由 AI 判断是否完成
#    - 适用于：数据下载、代码修改、代码检查、测试运行、问题分析等
#
# 2. nested（嵌套任务）
#    - 包含多个子任务的复杂任务
#    - 子任务按顺序执行
#    - 子任务失败时 AI 分析原因并决定重试策略
#    - 所有子任务完成后，AI 判断主任务是否完成
#    - 仅作为顶层任务使用
#    - 适用于：模型训练、性能优化、代码重构等多步骤任务
#
# 3. looping（循环任务）
#    - 固定循环 N 次执行所有子任务
#    - 每轮循环重置所有子任务状态，重新执行
#    - 子任务失败时 AI 分析原因并决定重试策略（在当前轮内重试）
#    - 不需要 AI 评估主任务是否完成，循环完指定次数即完成
#    - 仅作为顶层任务使用
#    - 适用于：迭代优化（profile→optimize→benchmark→commit 循环）
#
# 4. long_running（长时间任务）
#    - 使用 nohup 后台运行的任务
#    - 避免超时问题
#    - 启动监控进程检查状态
#    - 仅作为嵌套/循环任务的子任务使用
#    - 适用于：模型训练、数据处理等长时间任务
#
# 设计理念：
#   不区分"执行命令"和"修改代码"——对 AI 来说这是同一件事。
#   用户只需要判断："这个任务需要在后台长时间运行吗？"
#   需要就用 long_running，不需要就用 simple。
#
# 字段说明：
#
# 通用字段：
#   - id: 任务 ID（唯一标识）
#   - name: 任务名称
#   - type: 任务类型（simple / nested / looping / long_running）
#   - completion_criteria: 完成标准（自然语言描述）
#   - model: 模型选择（可选，"default" 或 "simple"，默认 "default"）
#     使用 "simple" 指定轻量模型执行简单任务（如运行命令、简单文件编辑）
#     使用 "default" 或省略此字段以使用默认模型
#
# simple 类型额外字段：
#   - initial_hint: 初始提示（给 AI 的参考信息，可选）
#
# nested 类型额外字段：
#   - subtasks: 子任务列表
#   - max_attempts: 最大重试轮数（可选，默认 20）
#
# looping 类型额外字段：
#   - subtasks: 子任务列表
#   - repeat_count: 循环次数（必填，正整数）
#   - max_attempts_per_loop: 每轮循环内最大重试次数（可选，默认 20）
#
# long_running 类型额外字段：
#   - command: 要执行的命令（可选，AI 可自行决定）
#
# ==========================================
# 使用建议
# ==========================================
#
# 1. 完成标准要具体明确
#    ✅ 好："accuracy >= 0.9"
#    ❌ 不好："精度要高"
#
# 2. 任务描述要清晰
#    ✅ 好："修改学习率从 0.001 到 0.0001"
#    ❌ 不好："优化参数"
#
# 3. 合理使用嵌套任务
#    - 需要多步骤且 AI 评估完成度的复杂任务使用 nested
#    - 固定循环 N 次的迭代任务使用 looping
#    - 简单一次性任务使用 simple
#
# 4. nested vs looping 的选择
#    - nested: AI 每轮评估是否完成，可能提前结束或继续重试
#    - looping: 固定循环 N 次，不做完成度评估，适合迭代优化
#
# 5. 长时间任务使用 long_running
#    - 模型训练
#    - 大数据处理
#    - 其他可能超时的任务
# ==========================================
